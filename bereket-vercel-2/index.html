<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Bereket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --frame:#E4F2E9; --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#EEF7F1; --ink:#10251A; --muted:#5B6F63; --line:#DDEAE2;
  --green:#1E7A46; --green-ink:#FFFFFF; --mint:#CDEBD8; --tomato:#C4382B; --wheat:#C08A0E; --leaf:#62A83A; --teal:#13837A; --slate:#6E8177; --animal:#B0472F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --frame:#060D09; --bg:#0C1712; --surface:#12211A; --sunk:#182C22; --ink:#E6F2EA; --muted:#97AE9F; --line:#243D30;
    --green:#4CC37F; --green-ink:#0C1712; --mint:#1F3D2D; --tomato:#F0705F; --wheat:#E8BE4C; --leaf:#9BD46E; --teal:#45C2B6; --slate:#91A69A; --animal:#F08A6E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --frame:#060D09; --bg:#0C1712; --surface:#12211A; --sunk:#182C22; --ink:#E6F2EA; --muted:#97AE9F; --line:#243D30;
  --green:#4CC37F; --green-ink:#0C1712; --mint:#1F3D2D; --tomato:#F0705F; --wheat:#E8BE4C; --leaf:#9BD46E; --teal:#45C2B6; --slate:#91A69A; --animal:#F08A6E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--green); outline-offset:2px; border-radius:8px}
img{max-width:100%}

/* ---------- App frame ---------- */
.app{max-width:440px; margin:0 auto; min-height:100%; background:var(--bg); display:flex; flex-direction:column; position:relative}
@media (min-width:520px){
  body{background:var(--frame); padding:24px 0}
  .app{height:min(900px, calc(100dvh - 48px)); min-height:0; overflow-y:auto; border-radius:38px; border:1px solid var(--line); box-shadow:0 40px 80px -40px rgba(16,70,40,.45); scrollbar-width:none}
  .app::-webkit-scrollbar{display:none}
}
.appbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px 12px; background:var(--bg); border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar .who{display:flex; align-items:center; gap:10px; min-width:0}
.appbar h1{font-family:var(--display); font-size:22px; font-weight:800; letter-spacing:-.015em; margin:0; line-height:1.1}
.appbar small{display:block; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:42px; height:42px; border-radius:50%; border:0; background:var(--sunk); display:grid; place-items:center; cursor:pointer; color:var(--ink); flex:none}
.main{flex:1; padding:8px 18px 28px}
.tabs{position:sticky; bottom:0; z-index:6; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line); padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:11px; font-weight:600; color:var(--muted); cursor:pointer}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs .fab .ic{width:58px; height:58px; margin-top:-30px; border-radius:50%; background:var(--green); color:var(--green-ink); display:grid; place-items:center; border:5px solid var(--surface); box-shadow:0 10px 20px -8px rgba(30,122,70,.7)}
.tabs .fab[aria-current="page"] .ic{background:var(--ink); color:var(--bg)}
.app.auth .appbar,.app.auth .tabs{display:none}
.app.auth .main{padding:0}

/* ---------- Type ---------- */
h1,h2,h3{font-family:var(--display); letter-spacing:-.015em; margin:0}
.hero{font-size:31px; line-height:1.08; font-weight:800}
.hero-sub{font-size:16px; color:var(--muted); margin:10px 0 0}
h2{font-size:19px; font-weight:700; line-height:1.25}
h3{font-size:16px; font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.lead{color:var(--muted); margin:4px 0 18px}

/* ---------- Blocks ---------- */
.section{margin-top:22px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px}
.stack{display:grid; gap:14px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:16px; padding:13px 20px; font-weight:700; cursor:pointer; background:var(--green); color:var(--green-ink); min-height:52px; font-size:16px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.ghost{background:var(--sunk); color:var(--ink)}
.btn.line{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 14px; min-height:40px; font-size:14px; border-radius:12px}
.btn.block{width:100%}
.link{background:none; border:0; padding:0; color:var(--green); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--sunk); border-radius:14px; padding:4px}
.seg button{border:0; background:none; padding:9px 12px; border-radius:11px; font-weight:600; font-size:14px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(16,37,26,.12)}

.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:13px; font-weight:600; background:var(--sunk)}
.chip.good{color:var(--green)} .chip.bad{color:var(--tomato)}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}

.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--muted); margin-top:8px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.hbar{display:grid; grid-template-columns:118px 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:14px}
.hbar .track{height:10px; background:var(--sunk); border-radius:5px; overflow:hidden}
.hbar .fill{height:100%; border-radius:5px; background:var(--green)}
.chart{width:100%; height:auto; display:block}
.chart text{font-family:var(--body); font-size:10px; fill:var(--muted)}

.list{list-style:none; margin:0; padding:0}
.list li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.list li:first-child{border-top:0}

/* ---------- Forms ---------- */
label.f{display:grid; gap:6px; font-size:14px; font-weight:600}
.in, select, input[type=date], input[type=number], input[type=text], input[type=password], textarea{width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:11px 14px; min-height:50px}
.in:focus, select:focus, input:focus, textarea:focus{border-color:var(--green); outline:none; box-shadow:0 0 0 4px var(--mint)}
.fields{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.fields .wide{grid-column:1/-1}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--green); font-weight:700; font-size:13px; padding:8px 10px; cursor:pointer}
.check{display:flex; align-items:center; gap:10px; font-size:14px}
.check input{width:20px; height:20px; accent-color:var(--green)}

.drop{display:grid; place-items:center; text-align:center; gap:8px; border:2px dashed var(--line); border-radius:22px; padding:26px 16px; cursor:pointer; background:var(--sunk); min-height:210px; position:relative; overflow:hidden}
.drop.over{border-color:var(--green)}
.drop input{position:absolute; inset:0; opacity:0; cursor:pointer}
.drop img{max-height:280px; border-radius:14px; object-fit:contain}
.drop strong{font-family:var(--display); font-size:19px}
.drop .cam{width:64px; height:64px; border-radius:50%; background:var(--green); color:var(--green-ink); display:grid; place-items:center}

.irow{display:grid; gap:8px; grid-template-columns:1fr 1fr; grid-template-areas:"name name" "cat type" "kg route"; padding:14px 0; border-top:1px solid var(--line); position:relative}
.irow:first-child{border-top:0; padding-top:4px}
.irow [data-f=name]{grid-area:name; padding-right:52px} .irow [data-f=category]{grid-area:cat} .irow [data-f=type]{grid-area:type}
.irow .kg{grid-area:kg} .irow [data-f=route]{grid-area:route}
.irow .del{position:absolute; right:6px; top:20px}
.irow:first-child .del{top:10px}
.kg{display:flex; align-items:center; gap:6px} .kg span{color:var(--muted); font-size:14px}
.icon{width:38px; height:38px; border-radius:50%; border:0; background:var(--sunk); cursor:pointer; font-size:20px; line-height:1; color:var(--muted); flex:none}
.ai-note{border-left:4px solid var(--green); padding:10px 14px; background:var(--sunk); border-radius:0 14px 14px 0; margin-bottom:12px}

.scan{display:grid; place-items:center; text-align:center; gap:12px; padding:26px 12px}
.nazar-big circle{transform-origin:50% 50%}
@media (prefers-reduced-motion:no-preference){
  .nazar-big .r1{animation:pulse 1.8s ease-in-out infinite}
  .nazar-big .r2{animation:pulse 1.8s ease-in-out .2s infinite}
  .nazar-big .r3{animation:pulse 1.8s ease-in-out .4s infinite}
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.day{border-top:1px solid var(--line); padding:16px 0; display:grid; gap:10px}
.day:first-child{border-top:0; padding-top:2px}
.day h3{display:flex; gap:10px; align-items:baseline}
.sugg{display:flex; gap:12px; align-items:flex-start}
.sugg .bar{width:4px; align-self:stretch; border-radius:2px; flex:none}
.plan{white-space:pre-wrap; line-height:1.6; font-size:15px}

.route{display:grid; gap:8px; border-radius:22px; padding:18px; background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--c)}
.route .big{font-family:var(--display); font-size:30px; font-weight:800; line-height:1}
.statusline{display:grid; gap:8px; padding:14px 0; border-top:1px solid var(--line)}

.impact{display:grid; border-top:1px solid var(--line)}
.impact > div{padding:16px 0; border-bottom:1px solid var(--line)}
.impact .v{font-family:var(--display); font-size:34px; font-weight:800; line-height:1.05; color:var(--green)}
.sdg{display:flex; gap:12px; align-items:flex-start; font-size:15px}
.sdg b{font-family:var(--display); font-size:16px; min-width:62px}

.steps{list-style:none; counter-reset:s; padding:0; margin:22px 0 0; display:grid; gap:14px}
.steps li{counter-increment:s; display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:start}
.steps li::before{content:counter(s); width:34px; height:34px; border-radius:50%; background:var(--mint); color:var(--green); display:grid; place-items:center; font-weight:800; font-family:var(--display)}

/* ---------- Login ---------- */
.login{min-height:100%; display:flex; flex-direction:column}
.login-top{background:var(--green); color:var(--green-ink); padding:48px 26px 64px; border-radius:0 0 36px 36px; position:relative; overflow:hidden}
.login-top::after{content:""; position:absolute; right:-60px; top:-40px; width:220px; height:220px; border-radius:50%; border:28px solid rgba(255,255,255,.1)}
.login-top .logo{width:64px; height:64px; border-radius:20px; background:var(--bg); display:grid; place-items:center; margin-bottom:22px}
.login-top h2{font-size:38px; font-weight:800; line-height:1}
.login-top p{margin-top:10px; font-size:16px; opacity:.9; max-width:28ch}
.login-card{margin:-34px 16px 0; background:var(--surface); border-radius:26px; padding:18px; border:1px solid var(--line); box-shadow:0 20px 40px -24px rgba(16,70,40,.4); display:grid; gap:14px; position:relative; z-index:1}
.login-foot{padding:20px 26px 32px; text-align:center; display:grid; gap:8px}
.err{color:var(--tomato); font-size:14px; font-weight:600}

/* ---------- Sheet + toast ---------- */
dialog{border:0; padding:0; width:min(440px,100%); max-width:100%; margin:auto auto 0; border-radius:28px 28px 0 0; background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(6,20,12,.5)}
.dlg{padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px)); display:grid; gap:14px; max-height:88vh; overflow:auto}
.grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 4px}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:600; z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; width:max-content; max-width:min(400px, calc(100% - 32px)); text-align:center; font-size:14px}
.toast.show{opacity:1}

/* ---------- v3 additions ---------- */
.tabs{grid-template-columns:repeat(var(--n,5),1fr)}
.avatar{width:64px; height:64px; border-radius:20px; background:var(--green); color:var(--green-ink); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:24px; flex:none}
.profile-head{display:flex; gap:14px; align-items:center; margin:6px 0 4px}
.profile-head h2{font-size:22px}
.chip.h{color:var(--animal)} .chip.b{color:var(--green)} .chip.k{color:var(--slate)}
.split{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--sunk)}
.split i{display:block; height:100%}
.splitrow{display:grid; gap:6px; margin-top:12px}
.splitrow .row{justify-content:space-between; font-size:14px}
.meta{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{border-radius:18px; padding:14px; background:var(--sunk); border-left:5px solid var(--c)}
.tile b{display:block; font-family:var(--display); font-size:22px; line-height:1.1}
.tile span{font-size:13px; color:var(--muted)}
.stops{list-style:none; counter-reset:st; margin:0; padding:0}
.stops li{counter-increment:st; display:grid; grid-template-columns:34px 1fr; gap:12px; padding:16px 0; border-top:1px solid var(--line)}
.stops li:first-child{border-top:0; padding-top:4px}
.stops li::before{content:counter(st); width:30px; height:30px; border-radius:50%; background:var(--mint); color:var(--green); display:grid; place-items:center; font-weight:800; font-family:var(--display); font-size:14px}
.stops li.done::before{content:"✓"; background:var(--green); color:var(--green-ink)}
details.panel summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+"; font-size:22px; color:var(--muted); line-height:1}
details.panel[open] summary::after{content:"−"}
.ftable{width:100%; border-collapse:collapse; font-size:14px; margin-top:12px}
.ftable th{text-align:left; font-weight:600; color:var(--muted); font-size:12.5px; padding:6px 4px}
.ftable td{padding:5px 4px; border-top:1px solid var(--line)}
.ftable input{min-height:38px; padding:6px 8px; border-radius:10px; width:76px}
.rcard{display:grid; gap:10px}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:14px}
.kv b{display:block; font-family:var(--display); font-size:18px}

/* ---------- v9: canlı akış ---------- */
.feed{display:grid}
.feed-row{display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center; padding:10px 0; border:0; border-top:1px solid var(--line); background:none; text-align:left; cursor:pointer; color:var(--ink); width:100%}
.feed-row:first-child{border-top:0; padding-top:2px}
.feed-row .th{width:56px; height:56px; border-radius:14px; background:var(--sunk); overflow:hidden; display:grid; place-items:center; color:var(--muted)}
.feed-row .th img{width:100%; height:100%; object-fit:cover}
.feed-row strong{display:block; font-size:15px; line-height:1.3}
.feed-row .sub{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.feed-row .tl{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.chip.new{background:var(--green); color:var(--green-ink)}
.livedot{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--green)}
.livedot::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--green)}
@media (prefers-reduced-motion:no-preference){ .livedot::before{animation:blink 1.6s infinite} }
.live-banner{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:30; width:min(420px, calc(100% - 24px)); display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center; padding:10px 12px; border-radius:18px; background:var(--ink); color:var(--bg); box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.live-banner[hidden]{display:none}
.live-banner .th{width:52px; height:52px; border-radius:12px; overflow:hidden; background:rgba(255,255,255,.12); display:grid; place-items:center}
.live-banner .th img{width:100%; height:100%; object-fit:cover}
.live-banner b{display:block; font-size:14.5px}
.live-banner span{font-size:13px; opacity:.85}
.live-banner button{border:0; border-radius:12px; padding:9px 12px; font-weight:700; background:var(--green); color:var(--green-ink); cursor:pointer}
#detailBody{grid-auto-rows:max-content}
@media (min-width:700px){ #detail{width:min(560px, 100% - 32px); margin:auto; border-radius:28px} }
.detail-photo{width:100%; aspect-ratio:4/3; flex:none; border-radius:18px; background:var(--sunk); overflow:hidden; display:grid; place-items:center; color:var(--muted); font-size:14px}
.detail-photo img{width:100%; height:100%; object-fit:cover}
/* ---------- v8: finans ---------- */
.stack > *, form.panel > *{min-width:0}
#profileForm .fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.chip.src-foto{color:var(--wheat)} .chip.src-elle{color:var(--green)}
.fin{display:grid; gap:2px}
.fin .line{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:15px}
.fin .line:first-child{border-top:0}
.fin .line b{font-variant-numeric:tabular-nums; white-space:nowrap}
.fin .big{font-family:var(--display); font-size:24px; font-weight:800; line-height:1.15; margin-bottom:6px}
.note{font-size:13px; color:var(--muted); margin-top:10px}
.ftable td.ro{color:var(--muted); font-variant-numeric:tabular-nums}
.ftable input.name{width:150px}
.ftable input.sm{width:70px}
.tag{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--sunk)}
.tag.own{color:var(--green)} .tag.est{color:var(--wheat)}
.menurow{padding:14px 0; border-top:1px solid var(--line); display:grid; gap:8px}
.menurow:first-child{border-top:0; padding-top:2px}
.menurow .three{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:13px; color:var(--muted)}
.menurow .three b{display:block; color:var(--ink); font-size:15px; font-variant-numeric:tabular-nums}
.menurow .three b.neg{color:var(--tomato)}
.menurow .bar{height:6px; border-radius:3px; background:var(--sunk); overflow:hidden}
.menurow .bar i{display:block; height:100%; border-radius:3px}
/* ---------- v6: photo ---------- */
.photo-hero{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px; display:grid; gap:14px}
.photo-hero h2{font-size:21px}
.pbtns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pbtn{position:relative; overflow:hidden}
.pbtn input{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}
.pbtn.disabled{opacity:.45; pointer-events:none}
.thumbs{display:flex; gap:10px; overflow-x:auto; padding-bottom:2px}
.thumb{position:relative; flex:none; width:96px; height:96px; border-radius:16px; overflow:hidden; background:var(--sunk)}
.thumb img{width:100%; height:100%; object-fit:cover}
.thumb button{position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(10,20,14,.7); color:#fff; font-size:16px; line-height:1; cursor:pointer}
.thumb.add{display:grid; place-items:center; border:2px dashed var(--line); background:transparent; color:var(--muted); font-size:28px; cursor:pointer}
.thumb.add input{position:absolute; inset:0; opacity:0; cursor:pointer}
.hint{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--muted)}
.hint b{color:var(--ink)}
.analysis{border-radius:24px; overflow:hidden; border:1px solid var(--line); background:var(--surface)}
.analysis .head{display:grid; grid-template-columns:84px 1fr; gap:14px; padding:16px; background:var(--green); color:var(--green-ink); align-items:center}
.analysis .head img{width:84px; height:84px; object-fit:cover; border-radius:14px; border:2px solid rgba(255,255,255,.4)}
.analysis .head h3{font-size:18px}
.analysis .head p{font-size:13px; opacity:.9}
.analysis .body{padding:6px 16px 16px}
.arow{display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:12px 0; border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-weight:700}
.arow .sub{grid-column:1/-1; display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.arow .sub b{color:var(--ink); font-variant-numeric:tabular-nums}
.conf{grid-column:1/-1; height:5px; border-radius:3px; background:var(--sunk); overflow:hidden}
.conf i{display:block; height:100%; border-radius:3px}
.oc{display:grid; gap:6px; margin-top:12px}
/* ---------- v5 ---------- */
.qsearch{margin-bottom:10px}
.qcats{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none}
.qcats::-webkit-scrollbar{display:none}
.qcats button{flex:none; border:0; background:var(--sunk); color:var(--muted); border-radius:999px; padding:7px 13px; font-weight:600; font-size:13px; cursor:pointer}
.qcats button[aria-pressed="true"]{background:var(--green); color:var(--green-ink)}
.qgrid{display:flex; flex-wrap:wrap; gap:8px}
.qgrid button{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 13px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.qgrid button:active{border-color:var(--green)}
.map{width:100%; height:auto; display:block; border-radius:18px}
.map text{font-family:var(--body)}
.pin.visited circle.b{fill:var(--slate)}
.track{display:grid; gap:12px}
.trackstat{display:flex; gap:10px; align-items:flex-start; font-weight:600; font-size:15px}
.trackstat .live{width:10px; height:10px; border-radius:50%; background:var(--tomato); margin-top:6px; flex:none}
@media (prefers-reduced-motion:no-preference){ .trackstat .live{animation:blink 1.4s infinite} }
@keyframes blink{50%{opacity:.25}}
.rstats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.rstats div{background:var(--sunk); border-radius:14px; padding:10px 12px}
.rstats b{display:block; font-family:var(--display); font-size:19px}
.rstats span{font-size:12px; color:var(--muted)}
.notif{list-style:none; margin:0; padding:0}
.notif li{display:grid; grid-template-columns:52px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14px}
.notif li:first-child{border-top:0}
.notif time{font-weight:700; color:var(--green); font-variant-numeric:tabular-nums}
.pbar{display:grid; gap:4px; padding:10px 0; border-top:1px solid var(--line)}
.pbar:first-child{border-top:0}
.pbar .top{display:flex; justify-content:space-between; gap:10px; font-size:14px}
.pbar .track{height:12px; border-radius:6px; background:var(--sunk); overflow:hidden}
.pbar .track i{display:block; height:100%; border-radius:6px}
/* ---------- v4 ---------- */
.list li > .num{white-space:nowrap}
.tabs button{font-size:10.5px}
.role-pick{margin:-34px 16px 0; display:grid; gap:12px; position:relative; z-index:1}
.role-card{display:grid; grid-template-columns:56px 1fr 20px; gap:14px; align-items:center; text-align:left; padding:18px; border-radius:24px; border:1px solid var(--line); background:var(--surface); box-shadow:0 20px 40px -26px rgba(16,70,40,.45); cursor:pointer; color:var(--ink)}
.role-card:active{transform:scale(.99)}

.role-card b{display:block; font-family:var(--display); font-size:19px}
.role-card small{display:block; color:var(--muted); font-size:14px; margin-top:2px; line-height:1.35}
.role-card .arrow{font-size:26px; color:var(--muted)}
.backbtn{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); color:inherit; border:0; border-radius:999px; padding:8px 14px 8px 10px; font-weight:600; cursor:pointer; margin-bottom:20px}
.quick{display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none; border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.quick button:active{border-color:var(--green)}
.calc{background:var(--green); color:var(--green-ink); border-radius:22px; padding:18px; display:grid; gap:12px}
.calc .three{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.calc .three b{display:block; font-family:var(--display); font-size:22px; line-height:1.1}
.calc .three span{font-size:12.5px; opacity:.85}
.calc .og{font-size:13px; opacity:.92}
.flow{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; position:relative; margin-top:18px}
.flow::before{content:""; position:absolute; top:17px; left:12%; right:12%; height:3px; background:var(--line); z-index:0}
.flow > div{text-align:center; font-size:12px; color:var(--muted); position:relative; z-index:1}
.flow .c{width:36px; height:36px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center; background:var(--sunk); border:3px solid var(--bg); font-weight:800; font-family:var(--display)}

.save{padding:14px 0; border-top:1px solid var(--line); display:grid; gap:8px}
.save:first-child{border-top:0; padding-top:2px}
.save .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}

.save .three b{display:block; color:var(--ink); font-size:15px; font-variant-numeric:tabular-nums}

.save .bar i{display:block; height:100%; background:var(--green); border-radius:3px}
.bigtri{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}

.bigtri b{display:block; font-family:var(--display); font-size:21px; color:var(--green); line-height:1.1}
.bigtri span{font-size:12.5px; color:var(--muted)}

<script>
/* =========================================================
   Helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => Number(n || 0).toLocaleString('tr-TR', { maximumFractionDigits: d });
const fmtTL = n => Math.round(n || 0).toLocaleString('tr-TR') + '\u00A0₺';
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const SHORT = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const parseDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => parseDay(s).getDay();
const dm = s => `${s.slice(8,10)}.${s.slice(5,7)}`;
const uid = () => Math.random().toString(36).slice(2, 10);
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
const r1 = n => Math.round(n * 10) / 10;
const norm = s => String(s || '').trim().toLocaleLowerCase('tr');
const initials = s => (String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toLocaleUpperCase('tr');

const NAZAR = size => `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" style="fill:#1F4FB8"/><circle cx="20" cy="20" r="13" style="fill:#fff"/><circle cx="20" cy="20" r="8.5" style="fill:#8EC5F0"/><circle cx="20" cy="20" r="4" style="fill:#14213D"/></svg>`;
$$('.mark').forEach(m => m.innerHTML = NAZAR(34));
const IC = {
  pano:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tahmin:'<path d="M4 19h16"/><path d="M5 15l4-4 3 3 7-7"/><path d="M15 7h4v4"/>',

  profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  bugun:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',
  restoranlar:'<path d="M4 10h16l-1.5-5h-13z"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  akislar:'<path d="M5 20c0-9 5-15 15-15 0 10-6 15-14 15"/><path d="M5 20l8-8"/>'
};
IC.bprofil = IC.profil;
IC.tasarruf = '<path d="M12 3v18"/><path d="M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/>';

const icon = (k, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const R_TABS = ['pano','tahmin','kaydet','toplama','tasarruf'];
const B_TABS = ['bugun','restoranlar','akislar','btasarruf'];
const TITLES = { pano:'Pano', tahmin:'Üretim tahmini', kaydet:'Yemek ekle', toplama:'Taşıma sistemi', tasarruf:'Tasarruf', profil:'Profilim',
  bugun:'Bugünkü toplama', restoranlar:'Restoranlar', akislar:'Geri kazanım', btasarruf:'İlçe tasarrufu', bprofil:'Belediye profili' };
const TAB_LABEL = { pano:'Pano', tahmin:'Tahmin', kaydet:'Ekle', toplama:'Taşıma', tasarruf:'Tasarruf', bugun:'Bugün', restoranlar:'Restoranlar', akislar:'Akışlar', btasarruf:'Tasarruf' };

/* =========================================================
   Domain: ana bileşen → köken, karbon, maliyet
   ========================================================= */
const ORIGIN = { h:'Hayvansal', b:'Bitkisel', k:'Karışık' };
const ORIGIN_COLOR = { h:'var(--animal)', b:'var(--green)', k:'var(--slate)' };
// KARBON (sabit, düzenlenemez): kg CO2e / kg ürün.
//   Kaynak: Poore, J. & Nemecek, T. (2018). Reducing food's environmental impacts through producers and consumers.
//   Science 360(6392), 987–992. Değerler Our World in Data "ghg-per-kg-poore" veri setinden alınmıştır.
//   "Karışık" için FAO (2013) Food Wastage Footprint küresel ortalaması: 3,3 Gt CO2e / 1,3 Gt israf ≈ 2,5.
// ÇİĞ KARŞILIĞI (raw): 1 kg pişmiş yemek kaç kg çiğ ana bileşene denk gelir (yaklaşık pişme/tarif dönüşümü).
// FİYAT (tl): ana bileşenin tahmini alış fiyatı (₺/kg). Restoran kendi fiyatını Profil'den girer.
const MAINS = {
  dana:     { name:'Dana eti',          origin:'h', co2:99.48, src:'Beef (beef herd)', raw:1.4,  tl:750 },
  kuzu:     { name:'Kuzu eti',          origin:'h', co2:39.72, src:'Lamb & Mutton',    raw:1.4,  tl:800 },
  tavuk:    { name:'Tavuk',             origin:'h', co2:9.87,  src:'Poultry Meat',     raw:1.3,  tl:200 },
  balik:    { name:'Balık',             origin:'h', co2:13.63, src:'Fish (farmed)',    raw:1.25, tl:400 },
  peynir:   { name:'Peynir',            origin:'h', co2:23.88, src:'Cheese',           raw:1,    tl:350 },
  sut:      { name:'Süt & yoğurt',      origin:'h', co2:3.15,  src:'Milk',             raw:1,    tl:60 },
  yumurta:  { name:'Yumurta',           origin:'h', co2:4.67,  src:'Eggs',             raw:1,    tl:120 },
  pirinc:   { name:'Pirinç',            origin:'b', co2:4.45,  src:'Rice',             raw:0.4,  tl:80 },
  tahil:    { name:'Makarna & bulgur',  origin:'b', co2:1.57,  src:'Wheat & Rye',      raw:0.43, tl:40 },
  ekmek:    { name:'Ekmek & hamur işi', origin:'b', co2:1.57,  src:'Wheat & Rye (Bread)', raw:1, tl:45 },
  patates:  { name:'Patates',           origin:'b', co2:0.46,  src:'Potatoes',         raw:1.05, tl:25 },
  baklagil: { name:'Baklagil',          origin:'b', co2:1.79,  src:'Other Pulses',     raw:0.4,  tl:90 },
  sebze:    { name:'Sebze',             origin:'b', co2:0.53,  src:'Other Vegetables', raw:1.1,  tl:40 },
  meyve:    { name:'Meyve',             origin:'b', co2:1.05,  src:'Other Fruit',      raw:1,    tl:50 },
  tatli:    { name:'Şerbetli tatlı',    origin:'k', co2:1.81,  src:'Beet Sugar',       raw:1,    tl:150 },
  diger:    { name:'Diğer / karışık',   origin:'k', co2:2.5,   src:'FAO 2013 ortalama', raw:1,   tl:80 }
};
// Çöp sahasında 1 kg gıda atığından oluşan metan (kg CO2e): IPCC 2006 Atık Kılavuzu varsayılanları
// DOC 0,15 × DOCf 0,5 × MCF 1,0 × F 0,5 × 16/12 × (1 − OX 0,1) = 0,045 kg CH4 × GWP100 (AR5) 28 ≈ 1,26
const LANDFILL = 1.26;
const LEGACY = { ekmek:'ekmek', tahil:'tahil', sebze:'sebze', et:'tavuk', corba:'baklagil', salata:'sebze', tatli:'sut', diger:'diger', kirmizi_et:'dana', sut_yumurta:'sut', sebze_meyve:'sebze' };
const TYPES = { fazla:'Üretim fazlası', tabak:'Tabak artığı', hazirlik:'Hazırlık artığı', bozuk:'Bozulmuş / SKT' };
const TYPE_COLOR = { fazla:'var(--tomato)', tabak:'var(--wheat)', hazirlik:'var(--leaf)', bozuk:'var(--slate)' };
const ROUTES = {
  gida:    { name:'Gıda bankası / STK', short:'Gıda bankası', color:'var(--wheat)', desc:'Servis edilmemiş, soğuk zinciri korunmuş yemek ihtiyaç sahiplerine ulaşır. Tabak artığı bu hatta gönderilmez.' },
  mama:    { name:'Barınak mama hattı', short:'Mama', color:'var(--green)', desc:'Uygun artıklar belediyenin mama-kompost tesisinde işlenip hayvan barınaklarına gider.' },
  kompost: { name:'Kompost', short:'Kompost', color:'var(--leaf)', desc:'Kabuk ve hazırlık artıkları kompost olup park, bahçe ve tarım alanlarında kullanılır.' },
  biyogaz: { name:'Lisanslı tesis / biyogaz', short:'Biyogaz', color:'var(--teal)', desc:'Bozulmuş ürünler ve diğer akışlara uymayan atık lisanslı geri kazanım tesisine gider.' }
};
function defaultRoute(main, type){
  if (type === 'fazla') return 'gida';
  if (type === 'hazirlik') return 'kompost';
  if (type === 'bozuk') return 'biyogaz';
  if (['tahil','ekmek','pirinc','tavuk','dana','kuzu','balik','yumurta'].includes(main)) return 'mama';
  if (['sebze','meyve','baklagil','patates'].includes(main)) return 'kompost';
  return 'biyogaz';
}
function factorsOf(profile){
  const out = {}, P = profile?.prices || {};
  Object.entries(MAINS).forEach(([k, m]) => { const own = Number(P[k]) > 0; out[k] = { co2: m.co2, tl: own ? Number(P[k]) : m.tl, own }; });
  return out;
}
// Yemeğe özgü pişmiş → çiğ ana bileşen dönüşümü (çorba suyu, pilavın su çekmesi, etin pişme kaybı vb.)
const RAW_DISH = { corba:0.15, ezogelin:0.15, yayla:0.4, tavukcorba:0.15, domcorba:0.5, iskembe:0.3, fasulye:0.35, nohut:0.35, piyaz:0.35,
  tavuk:0.9, kofte:1.2, adana:1.4, tas:1.0, doner:1.4, tdoner:1.3, tandir:1.4, izgaratavuk:1.3, manti:0.4, firinmakarna:0.35,
  sutlac:0.8, kazandibi:0.8, cacik:0.7, haydari:0.8, menemen:0.6, karni:0.9, imam:1.0, turlu:1.0, taze:1.0, oturtma:1.0,
  kizartma:1.6, pure:0.8, ayran:0.5 };
let RAW_BY_NAME = null;
function rawFactor(it){
  if (Number(it.raw) > 0) return Number(it.raw);
  if (!RAW_BY_NAME) { RAW_BY_NAME = {}; Object.entries(DISH).forEach(([k, d]) => { RAW_BY_NAME[norm(d[0])] = RAW_DISH[k] ?? MAINS[d[1]].raw; }); }
  return RAW_BY_NAME[norm(it.name)] ?? (MAINS[it.main] || MAINS.diger).raw;
}
const rawKg = it => (Number(it.kg) || 0) * rawFactor(it);
const co2Of = (it, F) => rawKg(it) * (F[it.main] || F.diger).co2;
const tlOf  = (it, F) => rawKg(it) * (F[it.main] || F.diger).tl;
const originOf = it => (MAINS[it.main] || MAINS.diger).origin;

/* =========================================================
   Storage + accounts
   ========================================================= */
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch(e) {} };

const TOKEN_KEY = 'bereket.token';
let TOKEN = ssGet(TOKEN_KEY) || lsGet(TOKEN_KEY);
let CACHE = {};   // kullanıcı adı → { role, data }: kendi hesabın + ilçendeki hesaplar (sunucudan)
const roleOf = u => CACHE[u]?.role || (u === user ? role : 'restoran');

/* ---------- Claude artifact içinde: aynı API, Claude'un paylaşımlı veritabanıyla ----------
   Vercel'de window.claude yoktur ve istekler /api/... sunucu fonksiyonlarına gider.
   Claude artifact'inde aynı uç noktalar burada, Claude veritabanı (db) ve Claude (sample) ile yanıtlanır;
   aynı Claude hesabıyla açılan telefon ve bilgisayar aynı veriyi görür. */
const LOCAL = typeof window.claude?.use === 'function';
const DEVICE_ID = (() => { let d = ssGet('bereket.dev') || lsGet('bereket.dev'); if (!d) { d = Math.random().toString(36).slice(2, 10); lsSet('bereket.dev', d); } ssSet('bereket.dev', d); return d; })();
const LS = (() => {
  let db = null, ready = null, sampleP = null;
  const C = { accounts:{}, appdata:{}, photos:{} };
  const key = s => 'k' + [...new TextEncoder().encode(String(s))].map(b => b.toString(16).padStart(2, '0')).join('');
  const clone = v => JSON.parse(JSON.stringify(v));

/* Stacked daily bar chart; rows need {date, kg, [field]} */
function dailyChart(start, end, rows, field, colors, order, labels){
  const days = []; for (let d = start; d <= end; d = addDays(d, 1)) days.push(d);
  const by = {};
  rows.forEach(r => { by[r.date] ||= {}; by[r.date][r[field]] = (by[r.date][r[field]] || 0) + r.kg; });
  const niceMax = Math.ceil(Math.max(1, ...days.map(d => sum(Object.values(by[d] || {})))) / 4) * 4;
  const W = 360, H = 200, L = 28, B = 22, T = 6;
  const step = (W - L) / days.length, bw = Math.min(30, step * 0.66);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük grafik">`;
  for (let i = 0; i <= 4; i++) {
    const v = niceMax * i / 4, y = H - B - (H - B - T) * i / 4;
    out += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y + 3.5}" text-anchor="end">${fmt(v, 0)}</text>`;
  }
  days.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2; let y = H - B;
    order.forEach(k => {
      const v = (by[d] || {})[k] || 0; if (!v) return;
      const h = (H - B - T) * v / niceMax; y -= h;
      out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" style="fill:${colors[k]}"><title>${dm(d)} · ${labels[k]}: ${fmt(v)} kg</title></rect>`;
    });
    if (days.length <= 10 || i % 6 === 0 || i === days.length - 1)
      out += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${days.length <= 10 ? SHORT[dow(d)] : dm(d)}</text>`;
  });
  return out + '</svg>';
}
// Türkçe yüzde eki: %3,2'si, %40'ı, %25'i, %100'ü
function sfx(numStr, form){
  const s = String(numStr).replace(/[^0-9,]/g, ''); const d = s.replace(/,/g, '');
  const ones = { '1':'i','2':'si','3':'ü','4':'ü','5':'i','6':'sı','7':'si','8':'i','9':'u' };
  const tens = { '1':'u','2':'si','3':'u','4':'ı','5':'si','6':'ı','7':'i','8':'i','9':'ı' };
  let base;
  const last = d.slice(-1);
  if (last && last !== '0') base = ones[last];
  else if (/^0+$/.test(d)) base = 'ı';
  else if (/[1-9]00$/.test(d) && d.length === 3) base = 'ü';
  else if (/[1-9]0$/.test(d)) base = tens[d.slice(-2, -1)];
  else base = 'i';
  if (form === 'ni') return base + 'n' + base.slice(-1).replace('s', '');
  return base;
}
const P_ = (n, digits = 0, form) => { const t = fmt(n, digits); return '%' + t + "'" + sfx(t, form); };
const legend = (labels, colors) => `<div class="legend">${Object.entries(labels).map(([k, v]) => `<span><i class="dot" style="background:${colors[k]}"></i>${v}</span>`).join('')}</div>`;

/* Origin split: weight vs carbon */
function originSplit(rows, F){
  const kg = { h:0, b:0, k:0 }, co = { h:0, b:0, k:0 };
  rows.forEach(r => { const o = originOf(r); kg[o] += r.kg; co[o] += co2Of(r, F); });
  const tk = sum(Object.values(kg)) || 1, tc = sum(Object.values(co)) || 1;
  const bar = m => `<div class="split">${['h','b','k'].map(o => m[o] ? `<i style="width:${(m === kg ? kg[o] / tk : co[o] / tc) * 100}%; background:${ORIGIN_COLOR[o]}"></i>` : '').join('')}</div>`;
  const hk = Math.round(kg.h / tk * 100), hc = Math.round(co.h / tc * 100);
  return { hk, hc, kg, co, html:`
    <p>${hk > 0 ? `Atığın <strong>${P_(hk)}</strong> hayvansal kaynaklı, ama karbon ayak izinin <strong>${P_(hc)}</strong> ondan geliyor.` : 'Bu dönemde hayvansal kaynaklı atık yok.'}</p>
    <div class="splitrow"><div class="row"><span>Ağırlık</span><span class="num muted">${fmt(sum(Object.values(kg)))} kg</span></div>${bar(kg)}</div>
    <div class="splitrow"><div class="row"><span>Karbon</span><span class="num muted">${fmt(sum(Object.values(co)), 0)} kg CO₂e</span></div>${bar(co)}</div>
    ${legend(ORIGIN, ORIGIN_COLOR)}` };
}

function genDemo({ seed, scale, menu, name, type, readyAt }){

/* ---------- Mali tablo: israfın kâr-zarara etkisi ---------- */
function window30(){
  const F = factorsOf(S.profile), end = today(), start = addDays(end, -29);
  const rows = between(allRows(), start, end);
  const dates = [...new Set(rows.map(r => r.date))].sort();
  if (!dates.length) return null;
  const span = Math.min(30, Math.round((parseDay(end) - parseDay(dates[0])) / 864e5) + 1);
  const k = 30 / span, kg = sum(rows, r => r.kg);
  return { rows, F, span, k, openDays:dates.length,
    tl: sum(rows, r => tlOf(r, F)) * k, tlAvoid: sum(rows.filter(r => r.type !== 'hazirlik'), r => tlOf(r, F)) * k,
    weighed: kg ? sum(rows.filter(r => r.src !== 'foto'), r => r.kg) / kg : 1 };
}

/* ---------- Menü kârlılığı: israf porsiyon kârından ne kadar götürüyor ---------- */
function menuAnalysis(){
  const P = S.profile, F = factorsOf(P), W = window30(), M = P.monthly || {};
  const items = Object.values(P.menu || {}).filter(m => m.price > 0 && m.daily > 0);
  if (!items.length || !W) return { list:[] };
  const fco = M.ciro > 0 && M.alim > 0 ? M.alim / M.ciro : null;
  const list = items.map(m => {
    const main = mainByName(m.name), f = F[main] || F.diger, rw = rawFactor({ name:m.name, main });
    const portion = (Number(m.g) > 0 ? m.g : P.portionKg * 1000) / 1000;

    const kgDay = sum(waste, r => r.kg) / W.openDays, pDay = kgDay / portion;

const PERMANENT = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'];

/* Fotoğrafı küçült: uzun kenar ≤ 1600 px, JPEG. Telefon fotoğrafları (HEIC dahil, tarayıcı açabiliyorsa) böylece sınırın altına iner. */
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob || file;
  } catch (e) { return file; }
}
async function addPhotos(files){
  const list = [...files].filter(f => f && (f.type || '').startsWith('image/')).slice(0, imgMax - draft.photos.length);
  if (!list.length) { toast('Lütfen bir fotoğraf seçin'); return; }
  for (const f of list) { const blob = await shrink(f); draft.photos.push({ blob, url:URL.createObjectURL(blob) }); }
  draft.error = ''; draft.analysis = null; render();
}
async function analyze(){
  if (!sampleFn || !draft.photos.length) return;
  busy = new AbortController(); draft.error = ''; render(); scrollTop();
  const n = draft.photos.length;
  const prompt = `Bir toplu yemek işletmesinin (${S.profile.type}) gıda atığını gösteren ${n > 1 ? n + ' fotoğraf (aynı atığın farklı açıları; kalemleri iki kez sayma)' : '1 fotoğraf'} inceliyorsun.
Öğün: ${draft.meal}. Günün menüsü: ${draft.menu || 'belirtilmedi'}. Kap / ölçek: ${draft.container === 'otomatik' ? 'fotoğraftan sen belirle' : CONTAINERS[draft.container]}.

Görevin: Atığı yemek yemek kalemlere ayır. Her kalem için yemeği tanı, ağırlıkça baskın ana bileşenini seç ve yaklaşık ağırlığı kilogram olarak tahmin et. Ölçek için kabın boyutunu ve doluluk oranını kullan (120 L kova dolu ≈ 50-60 kg yemek atığı, GN 1/1 küvet 65 mm dolu ≈ 6-8 kg, tabldot tepsi artığı ≈ 0,1-0,4 kg, servis tabağı ≈ 0,1-0,3 kg). Menüdeki yemek adlarını tercih et.

Her kalem için:
- name: kısa Türkçe yemek adı
- main: şunlardan biri: dana (dana eti, köfte, kıyma, döner), kuzu (kuzu, adana, tandır), tavuk, balik, peynir, sut (süt, yoğurt, ayran, cacık, sütlü tatlı), yumurta, pirinc (pilav), tahil (makarna, bulgur, mantı, erişte), ekmek (ekmek, pide, lahmacun, börek, simit), patates, baklagil (mercimek, fasulye, nohut), sebze (sebze yemeği, salata, kabuk), meyve, tatli (şerbetli tatlı, baklava, revani), diger (ayırt edilemeyen karışık atık)
- type: fazla (hiç servis edilmemiş üretim fazlası, temiz kapta) | tabak (tabaktan dönen artık) | hazirlik (kabuk, sap, çekirdek) | bozuk (bozulmuş, küflü, SKT geçmiş)
- kg: sayı, 0.1 hassasiyetle
- confidence: 0 ile 1 arası, tanıma ve ağırlık tahmininin güvenilirliği

Ayrıca:
- summary: ne gördüğünü, kabı ve ağırlık varsayımını anlatan 1-2 kısa Türkçe cümle

Fotoğrafta gıda atığı yoksa items boş dizi olsun ve summary bunu söylesin.
Yalnızca şu biçimde JSON ver:
{"items":[{"name":"Tavuk sote","main":"tavuk","type":"tabak","kg":1.8,"confidence":0.7}],"summary":"...","tip":"..."}`;
  try {
    const res = await sampleFn.json(prompt, { images:draft.photos.map(p => p.blob), signal:busy.signal });
    const items = (Array.isArray(res?.items) ? res.items : []).map(x => {
      const raw = String(x?.main || '');
      const main = MAINS[raw] ? raw : (LEGACY[raw] || mainByName(x?.name || '') || 'diger');
      const type = TYPES[x?.type] ? x.type : 'tabak';
      const kg = Math.max(0, r1(Number(x?.kg) || 0));

    }).filter(x => x.kg > 0);
    if (!items.length) { draft.error = String(res?.summary || 'Fotoğrafta gıda atığı bulunamadı.').slice(0, 200) + ' Başka bir fotoğraf deneyin ya da elle ekleyin.'; return; }
    draft.analysis = { items:items.map(i => ({ ...i })), summary:String(res?.summary || '').slice(0, 400), tip:String(res?.tip || '').slice(0, 300), thumb:draft.photos[0].url };

    else draft.error = ERR[e?.code] || 'Bağlantı kesildi. Tekrar deneyin.';

}

function patterns(){
  const F = factorsOf(S.profile), end = today(), start = addDays(end, -27);
  const rows = between(allRows(), start, end);
  const datesByDow = {};
  S.entries.filter(e => e.date >= start && e.date <= end).forEach(e => (datesByDow[dow(e.date)] ||= new Set()).add(e.date));
  const map = {};
  rows.forEach(r => {
    if (r.type !== 'fazla' && r.type !== 'tabak') return;
    const w = dow(r.date), n = r.name.trim() || MAINS[r.main].name, k = w + '|' + norm(n);
    map[k] ||= { w, name:n, main:r.main, fazla:0, tabak:0, fazlaTL:0, fazlaCO:0 };
    map[k][r.type] += r.kg;
    if (r.type === 'fazla') { map[k].fazlaTL += tlOf(r, F); map[k].fazlaCO += co2Of(r, F); }
  });
  const out = {};
  Object.values(map).forEach(p => {
    const weeks = datesByDow[p.w]?.size || 1;
    p.fazlaAvg = p.fazla / weeks; p.tabakAvg = p.tabak / weeks; p.tlAvg = p.fazlaTL / weeks; p.coAvg = p.fazlaCO / weeks;
    if (p.fazlaAvg >= 0.5 || p.tabakAvg >= 1) (out[p.w] ||= []).push(p);
  });
  Object.values(out).forEach(a => a.sort((x, y) => y.tlAvg - x.tlAvg));
  return { byDow:out, daysCovered:new Set(rows.map(r => r.date)).size, rows };
}

let planData = null;
function mainByName(n){
  const k = norm(n);
  const d = Object.values(DISH).find(x => norm(x[0]) === k);
  if (d) return d[1];
  const r = S.entries.flatMap(e => e.items).find(i => norm(i.name) === k);
  return r?.main || 'diger';
}
function rulePlan(){
  const { byDow } = patterns(), P = S.profile, F = factorsOf(P), acts = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today(), i);
    (byDow[dow(d)] || []).forEach(p => {
      if (p.fazlaAvg >= 0.5) acts.push({ gun:DAYS[dow(d)], yemek:p.name, main:p.main, eylem:`Üretimi ${Math.max(1, Math.round(p.fazlaAvg / P.portionKg))} porsiyon azalt`, tl:p.tlAvg, co:p.coAvg });
      else if (p.tabakAvg >= 1) acts.push({ gun:DAYS[dow(d)], yemek:p.name, main:p.main, eylem:'Porsiyonu %20 küçült', tl:p.tabakAvg * 0.2 * rawFactor(p) * F[p.main].tl, co:p.tabakAvg * 0.2 * rawFactor(p) * F[p.main].co2 });
    });
  }
  return acts.sort((a, b) => b.tl - a.tl).slice(0, 8);
}
function planChart(acts){
  if (!acts.length) return '<p class="muted">Önümüzdeki hafta için eylem gerektiren bir örüntü yok.</p>';
  const tl = sum(acts, a => a.tl), co = sum(acts, a => a.co), max = Math.max(...acts.map(a => a.tl), 1);
  const order = [1, 2, 3, 4, 5, 6, 0], byDay = {};
  acts.forEach(a => { const w = DAYS.indexOf(a.gun); byDay[w] = (byDay[w] || 0) + a.tl; });
  const dmax = Math.max(1, ...Object.values(byDay));

const DEPOT = { x:9, y:86, name:'Belediye garajı' };

const KM_PER_UNIT = 0.075, SPEED_KMH = 22, SERVICE_MIN = 6;
function posOf(u){

}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) * KM_PER_UNIT;
const toMin = s => { const [a, b] = String(s || '16:00').split(':').map(Number); return a * 60 + (b || 0); };

function pathKm(seq){ let p = DEPOT, d = 0; seq.forEach(s => { d += dist(p, s); p = s; }); return d + dist(p, DEPOT); }

      const c = [...out.slice(0, i), ...out.slice(i, k + 1).reverse(), ...out.slice(k + 1)];

}
function districtStops(district){

    const todays = data.pickups.filter(p => p.date === today());

    return { u, data, name:data.profile.name || u, type:data.profile.type, x, y, pendKg:sum(pend, r => r.kg), byRoute,
      ready:data.ready?.date === today() ? data.ready.at : null, doneKg:sum(todays, p => p.kg), doneAt:todays.length ? todays[todays.length - 1].created.slice(11) : null };
  });
}
function buildRoute(district){
  const muni = municipalityFor(district) || DEFAULT_B;

  R = optimize(R, DEPOT, N.length ? N.reduce((c, s) => ({ x:c.x + s.x / N.length, y:c.y + s.y / N.length }), { x:0, y:0 }) : DEPOT);

    s.eta = t; s.idx = i;

/* =========================================================
   TASARRUF
   ========================================================= */
/*
  Tasarruf yöntemi:
  - Karşılaştırma noktası: restoranın ilk 7 kayıt günü (her haftanın günü bir kez).
  - Sonraki her TAMAMLANMIŞ gün (bugün hariç), aynı yemeğin aynı haftanın günündeki ilk hafta değeriyle karşılaştırılır.
  - Beklenen = ilk hafta değeri, gerçekleşen = o günün değeri. Tasarruf = beklenen − gerçekleşen.
  - İlk haftada hiç olmayan yemekler/günler karşılaştırılamaz; toplamlara katılmaz, ayrıca listelenir.
  - Hazırlık artığı (kabuk vb.) önlenemez sayılır, hesaba girmez.
*/
function savings(data){
  const F = factorsOf(data.profile), t = today(), SEP = '\u0001';
  const rows = rowsOf(data).filter(r => r.type !== 'hazirlik' && r.date < t);
  const dates = [...new Set(data.entries.map(e => e.date))].filter(d => d < t).sort();
  if (dates.length < 8) return null;
  const baseEnd = addDays(dates[0], 6);
  const later = dates.filter(d => d > baseEnd);
  if (!later.length) return null;
  const nameOf = r => r.name.trim() || MAINS[r.main].name;
  const base = {}, act = {}, mainOf = {};
  rows.forEach(r => {
    const n = nameOf(r); mainOf[n] ||= r.main;
    if (r.date <= baseEnd) base[n + SEP + dow(r.date)] = (base[n + SEP + dow(r.date)] || 0) + r.kg;
    else act[n + SEP + r.date] = (act[n + SEP + r.date] || 0) + r.kg;
  });
  const dish = {}, unmatched = {};
  later.forEach(d => {
    const w = dow(d), names = new Set();
    Object.keys(base).forEach(k => { const [n, ww] = k.split(SEP); if (+ww === w) names.add(n); });
    names.forEach(n => {
      const e = base[n + SEP + w], a = act[n + SEP + d] || 0;
      dish[n] ||= { exp:0, act:0 }; dish[n].exp += e; dish[n].act += a;
    });
    Object.keys(act).forEach(k => { const [n, dd] = k.split(SEP); if (dd === d && !(base[n + SEP + w] > 0)) unmatched[n] = (unmatched[n] || 0) + act[k]; });
  });
  const mk = (name, main, exp, actual) => { const kg = exp - actual, f = F[main] || F.diger, rw = rawFactor({ name, main }); return { name, main, exp, act:actual, kg, pct: exp ? kg / exp * 100 : 0, tl:kg * rw * f.tl, co:kg * rw * f.co2 }; };
  const dishes = Object.entries(dish).map(([n, v]) => mk(n, mainOf[n], v.exp, v.act)).sort((a, b) => b.tl - a.tl);
  const byMain = {};
  dishes.forEach(d => { const x = byMain[d.main] ||= { name:MAINS[d.main].name, main:d.main, exp:0, act:0, tl:0, co:0 }; x.exp += d.exp; x.act += d.act; x.tl += d.tl; x.co += d.co; });
  const mains = Object.values(byMain).map(x => ({ ...x, kg:x.exp - x.act, pct: x.exp ? (x.exp - x.act) / x.exp * 100 : 0 })).sort((a, b) => b.tl - a.tl);
  const del = rowsOf(data).filter(r => r.picked);
  const streams = Object.keys(ROUTES).map(k => { const rs = del.filter(r => r.route === k), kg = sum(rs, r => r.kg); return { k, kg, methane:kg * LANDFILL, tl:sum(rs, r => tlOf(r, F)) }; });
  const exp = sum(dishes, d => d.exp), actual = sum(dishes, d => d.act);
  return { dishes, mains, streams, base:[dates[0], baseEnd], range:[later[0], later[later.length - 1]], days:later.length,
    unmatched:Object.entries(unmatched).map(([n, kg]) => ({ name:n, kg })).sort((a, b) => b.kg - a.kg),
    total:{ exp, act:actual, kg:exp - actual, pct: exp ? (exp - actual) / exp * 100 : 0, tl:sum(dishes, d => d.tl), co:sum(dishes, d => d.co) } };
}
function saveRows(list){
  const max = Math.max(1, ...list.map(x => Math.abs(x.tl)));
  return list.map(x => {
    const neg = x.kg < -0.05, o = x.main ? MAINS[x.main].origin : null, p = Math.round(Math.abs(x.pct));
    return `<div class="save">
      <div class="top"><div style="min-width:0"><strong>${esc(x.name)}</strong>${o ? ` <span class="chip ${o}">${ORIGIN[o]}</span>` : ''}${x.sub ? `<div class="small muted">${esc(x.sub)}</div>` : ''}</div>
        <span class="small ${neg ? 'err' : ''}" style="white-space:nowrap; font-weight:700; ${neg ? '' : 'color:var(--green)'}">%${p} ${neg ? 'arttı' : 'azaldı'}</span></div>
      <div class="three">
        <div><b class="num ${neg ? 'neg' : ''}">${neg ? '+' : ''}${fmt(Math.abs(x.kg))} kg</b>${neg ? 'fazla israf' : 'önlenen israf'}</div>
        <div><b class="num ${neg ? 'neg' : ''}">${fmtTL(Math.abs(x.tl))}</b>${neg ? 'ek kayıp' : 'tasarruf'}</div>
        <div><b class="num ${neg ? 'neg' : ''}">${fmt(Math.abs(x.co), 0)} kg</b>CO₂e</div>
      </div>
      <div class="small muted num">Beklenen ${fmt(x.exp)} kg → gerçekleşen ${fmt(x.act)} kg</div>
      <div class="bar"><i style="width:${(Math.abs(x.tl) / max * 100).toFixed(1)}%; ${neg ? 'background:var(--tomato)' : ''}"></i></div>
    </div>`;
  }).join('');
}
function streamRows(streams, mealKg){
  const note = { gida: s => `≈ ${fmt(s.kg / mealKg, 0)} öğün ihtiyaç sahiplerine ulaştı`, mama: () => 'barınaklara mama hammaddesi olarak gitti', kompost: () => 'park, bahçe ve tarım alanlarına kompost oldu', biyogaz: () => 'lisanslı tesiste enerjiye dönüştü' };
  return streams.map(s => `<div class="save">
    <div class="top"><strong><i class="dot" style="background:${ROUTES[s.k].color}; margin-right:6px"></i>${ROUTES[s.k].name}</strong></div>

  </div>`).join('');
}
const methodNote = sv => `İlk haftanız (${dm(sv.base[0])}–${dm(sv.base[1])}) karşılaştırma noktasıdır. ${dm(sv.range[0])}–${dm(sv.range[1])} arasındaki ${sv.days} tamamlanmış günün her biri, aynı yemeğin ilk haftadaki aynı günüyle karşılaştırıldı. Bugün ve hazırlık artıkları dahil değildir.`;
let saveBy = 'dish';

  <p class="small muted section">${methodNote(sv)}</p>`;
}
function vBtasarruf(){
  const list = restaurantsIn(S.profile.district).map(r => ({ ...r, sv:savings(r.data) })).filter(r => r.sv);
  if (!list.length) return `<h2 class="hero">Tasarruf için restoranların en az 8 tamamlanmış kayıt günü gerekiyor.</h2>
    <div class="stack" style="margin-top:22px"><button class="btn ghost block" data-action="seed-district">Örnek restoranları ekle</button></div>`;
  const per = list.map(r => ({ name:r.data.profile.name || r.u, sub:`${r.data.profile.type} · ${r.sv.days} gün karşılaştırıldı`, exp:r.sv.total.exp, act:r.sv.total.act, kg:r.sv.total.kg, pct:r.sv.total.pct, tl:r.sv.total.tl, co:r.sv.total.co })).sort((a, b) => b.tl - a.tl);
  const dish = {};
  list.forEach(r => r.sv.dishes.forEach(d => { const F = factorsOf(r.data.profile)[d.main] || MAINS.diger; dish[d.name] ||= { name:d.name, main:d.main, exp:0, act:0, tl:0, co:0 }; const x = dish[d.name]; x.exp += d.exp; x.act += d.act; x.tl += d.tl; x.co += d.co; }));
  const dishes = Object.values(dish).map(d => ({ ...d, kg:d.exp - d.act, pct: d.exp ? (d.exp - d.act) / d.exp * 100 : 0 })).sort((a, b) => b.tl - a.tl).slice(0, 12);
  const streams = Object.keys(ROUTES).map(k => { const all = list.map(r => r.sv.streams.find(s => s.k === k)); return { k, kg:sum(all, s => s.kg), methane:sum(all, s => s.methane), tl:sum(all, s => s.tl) }; });
  const E = sum(per, p => p.exp), A = sum(per, p => p.act);

function stopsToday(){ return districtStops(S.profile.district); }
function vBugun(){
  const route = buildRoute(S.profile.district);
  if (!route.all.length) { trackCtx = null; return `<h2 class="hero">${esc(S.profile.district)} ilçesinde kayıtlı restoran yok.</h2>
    <p class="hero-sub">Restoranlar Bereket'e ${esc(S.profile.district)} ilçesiyle kayıt olduğunda günlük rota burada oluşur.</p>
    <div class="stack" style="margin-top:22px"><button class="btn ghost block" data-action="seed-district">Örnek restoranları ekle</button></div>`; }
  trackCtx = route.seq.length ? { route, focus:null } : null;
  const done = route.all.filter(s => s.pendKg === 0 && s.doneKg > 0);
  const notifs = route.all.filter(s => s.ready && s.pendKg > 0).sort((a, b) => b.ready.localeCompare(a.ready));

function vRestoranlar(){
  const list = restaurantsIn(S.profile.district);
  if (!list.length) return vBugun();
  const end = today(), start = addDays(end, -6), pstart = addDays(start, -7), pend = addDays(start, -1);
  const stats = list.map(({ u, data }) => {
    const F = factorsOf(data.profile), all = rowsOf(data), rows = between(all, start, end), prev = between(all, pstart, pend);
    const kg = sum(rows, r => r.kg), pk = sum(prev, r => r.kg);
    const anim = sum(rows.filter(r => originOf(r) === 'h'), r => r.kg);
    const byDish = {}; rows.filter(r => r.type !== 'hazirlik').forEach(r => byDish[r.name] = (byDish[r.name] || 0) + tlOf(r, F));
    return { u, p:data.profile, kg, tl:sum(rows, r => tlOf(r, F)), co:sum(rows, r => co2Of(r, F)), animPct: kg ? Math.round(anim / kg * 100) : 0,
      trend: pk ? Math.round((kg - pk) / pk * 100) : null, last: all.length ? all.map(r => r.date).sort().pop() : null,
      top:Object.entries(byDish).sort((a, b) => b[1] - a[1]).slice(0, 3) };
  }).sort((a, b) => b.tl - a.tl);
  const T = { kg:sum(stats, s => s.kg), tl:sum(stats, s => s.tl), co:sum(stats, s => s.co) };
  return `<h2 class="hero num">Bu hafta ilçedeki ${stats.length} restoranda ${fmt(T.kg)} kg israf.</h2>
  <p class="hero-sub">Mali karşılığı ${fmtTL(T.tl)}, karbon ayak izi ${fmt(T.co, 0)} kg CO₂e. Liste mali kayba göre sıralı.</p>
  <div class="stack section">${stats.map(s => `<details class="panel">
    <summary><div style="min-width:0"><strong>${esc(s.p.name || s.u)}</strong><div class="small muted">${esc(s.p.type)}</div><div class="small num" style="margin-top:2px"><strong>${fmt(s.kg)} kg</strong> · ${fmtTL(s.tl)} · hayvansal %${s.animPct}</div></div></summary>
    <div class="kv" style="margin-top:14px">
      <div><span class="muted">Atık (7 gün)</span><b class="num">${fmt(s.kg)} kg</b></div>
      <div><span class="muted">Mali kayıp</span><b class="num">${fmtTL(s.tl)}</b></div>
      <div><span class="muted">Karbon</span><b class="num">${fmt(s.co, 0)} kg CO₂e</b></div>
      <div><span class="muted">Hayvansal pay</span><b class="num">%${s.animPct}</b></div>
    </div>
    <p class="small muted" style="margin-top:10px">${s.last ? 'Son kayıt ' + dm(s.last) : 'Kayıt yok'}</p><div class="row" style="margin-top:8px">${s.trend == null ? '' : s.trend <= 0 ? `<span class="chip good">Geçen haftaya göre %${-s.trend} az</span>` : `<span class="chip bad">Geçen haftaya göre %${s.trend} fazla</span>`}</div>
    ${s.top.length ? `<p class="small muted" style="margin-top:10px">En çok kayıp: ${s.top.map(([n, v]) => `${esc(n)} (${fmtTL(v)})`).join(', ')}</p>` : ''}
  </details>`).join('')}</div>`;
}
function vAkislar(){
  const list = restaurantsIn(S.profile.district);
  if (!list.length) return vBugun();
  const pickups = list.flatMap(({ data }) => data.pickups);
  const end = today(), start = addDays(end, -13), m30 = addDays(end, -29);
  const p14 = pickups.filter(p => p.date >= start && p.date <= end);

  const tot = k => sum(p30.filter(p => p.route === k), p => p.kg);

    <div class="section-head"><h2>Günlük toplanan</h2><span class="small muted">son 14 gün, kg</span></div>

  <div class="stack section">${Object.entries(ROUTES).map(([k, r]) => `<div class="route" style="--c:${r.color}">

}

document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'authForm') { e.preventDefault(); submitAuth(f); }
  else if (f.id === 'profileForm') {
    e.preventDefault();
    const p = { ...S.profile };
    delete p.factors;
    const num = k => { const v = parseFloat(String(f.elements[k]?.value || '').replace(',', '.')); return v > 0 ? v : 0; };
    ['name','type','district'].forEach(k => p[k] = f.elements[k].value.trim());
    if (num('portionKg')) p.portionKg = num('portionKg');
    p.monthly = { ciro:num('ciro'), alim:num('alim') };
    p.prices = {};
    Object.keys(MAINS).forEach(k => { if (num('tl_' + k)) p.prices[k] = num('tl_' + k); });
    p.menu = {};
    for (let i = 0; f.elements['mn_' + i]; i++) {
      const name = String(f.elements['mn_' + i].value || '').trim().slice(0, 60);
      const price = num('mp_' + i), daily = num('md_' + i), g = num('mg_' + i);
      if (name && (price || daily)) p.menu[norm(name)] = { name, price, daily, g };
    }
    S.profile = p; save(); render(); toast('Bilgiler kaydedildi');
  }
  else if (f.id === 'moneyForm') {
    e.preventDefault();
    const v = k => { const x = parseFloat(String(f.elements[k].value || '').replace(',', '.')); return x > 0 ? x : 0; };
    S.profile = { ...S.profile, monthly:{ ciro:v('ciro'), alim:v('alim') } };
    save(); render(); toast('Mali bilgiler kaydedildi');
  }
  else if (f.id === 'bprofileForm') {
    e.preventDefault();
    S.profile = { ...S.profile, name:f.elements.name.value.trim(), district:f.elements.district.value.trim() || S.profile.district, collectTime:f.elements.collectTime.value || '16:00' };
    save(); render(); toast('Bilgiler kaydedildi');
  }
});

['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.('.photo-hero'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
document.addEventListener('dragleave', e => { const d = e.target.closest?.('.photo-hero'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest?.('.photo-hero'); if (!d) return;
  e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer?.files?.[0];
  if (e.dataTransfer?.files?.length && imagesOK && !aiBlocked) addPhotos(e.dataTransfer.files);
});

async function uploadPhoto(entryId, blob){
  try {
    let small = await shrinkTo(blob, 720, 0.72);
    if (small.size > 170000) small = await shrinkTo(blob, 560, 0.6);
    const r = await api('/api/photo', { method:'POST', body:{ entryId, image:{ type:'image/jpeg', data:await blobToB64(small) } } });
    const e = S.entries.find(x => x.id === entryId);
    if (e) { e.photo = r.id; save(); }
  } catch (e) { toast('Kayıt kaydedildi, fotoğraf yüklenemedi.'); }
}
async function shrinkTo(file, edge, q){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, edge / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
    return (await new Promise(r => c.toBlob(r, 'image/jpeg', q))) || file;
  } catch (e) { return file; }
}
function saveEntry(){
  const items = draft.items.filter(i => (Number(i.kg) || 0) > 0).map(i => ({ name:(i.name || '').trim(), main:i.main, type:i.type, kg:r1(Number(i.kg)), route:i.route, picked:null, src:i.src === 'foto' ? 'foto' : 'elle', ...(i.conf != null ? { conf:i.conf } : {}) }));
  if (!items.length) { toast('En az bir satıra ağırlık girin'); return; }
  const entry = { id:uid(), date:draft.date || today(), meal:draft.meal, menu:draft.menu, items, summary:draft.summary, tip:draft.tip, source:draft.source, at:new Date().toISOString(), dev:DEVICE_ID };
  S.entries.push(entry);
  save();
  if (draft.photos.length) uploadPhoto(entry.id, draft.photos[0].blob);
  draft.photos.forEach(p => URL.revokeObjectURL(p.url));
  const F = factorsOf(S.profile), H = items.filter(i => originOf(i) === 'h');
  const result = { date:draft.date || today(), meal:draft.meal, items, kg:sum(items, i => i.kg), co:sum(items, i => co2Of(i, F)), tl:sum(items, i => tlOf(i, F)), hk:sum(H, i => i.kg), hc:sum(H, i => co2Of(i, F)) };
  draft = { ...newDraft(), date:draft.date, meal:draft.meal, menu:draft.menu, result };
  render(); scrollTop();
}

const blobToB64 = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(b); });
function parseJSONText(t){
  const s = String(t || '').replace(/```(?:json)?/g, '');
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if (i < 0 || j < i) throw { code:'invalid_json' };
  try { return JSON.parse(s.slice(i, j + 1)); } catch (e) { throw { code:'invalid_json' }; }
}
const AI = {
  async json(prompt, { images = [], signal } = {}){
    const imgs = [];
    for (const b of images) imgs.push({ type: b.type && /^image\/(jpeg|png|webp|gif)$/.test(b.type) ? b.type : 'image/jpeg', data: await blobToB64(b) });
    if (signal?.aborted) throw { code:'cancelled' };
    const r = await api('/api/ai', { method:'POST', body:{ prompt, images:imgs }, signal });
    return parseJSONText(r.text);
  },
  async limits(){ return { images:{ maxCount:3 } }; }
};

})();
